<div class="progress-container"
     [ngStyle]="{'background': config?.backgroundColor || 'grey', 'position': config.position, 'top': $safeNavigationMigration(config?.top), 'right': $safeNavigationMigration(config?.right), 'bottom': $safeNavigationMigration(config?.bottom), 'left': $safeNavigationMigration(config?.left)}">
    <div class="progress-bar"
         id="progressBar"
         [ngStyle]="{'background': config?.barColor || 'red'}"></div>
</div>
